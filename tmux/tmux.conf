# prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# quality of life
set -g mouse on
set -g escape-time 0        # critical for neovim, no esc delay
set -g base-index 1         # windows start at 1 not 0
set -g pane-base-index 1    # panes too
set -g renumber-windows on  # fill gaps when you close a window

# splits
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# pane navigation (hjkl)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# window navigation
bind -r n next-window
bind -r p previous-window
bind c new-window -c "#{pane_current_path}"   # new window in same path

# reload config
bind r source-file ~/.tmux.conf \; display "reloaded"